<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      font-family: Tahoma, Arial, sans-serif;
      margin: 10px;
      background-color: #f7f9fa;
      color: #333;
    }
    .container {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h3 {
      margin-top: 0;
      color: #1a73e8;
      text-align: center;
      font-size: 16px;
    }
    .url-box {
      font-size: 11px;
      word-break: break-all;
      background: #f0f0f0;
      padding: 8px;
      border-radius: 4px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      max-height: 50px;
      overflow-y: auto;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #1557b0;
    }
    .result {
      margin-top: 15px;
      padding: 10px;
      border-radius: 4px;
      text-align: center;
      font-weight: bold;
      display: none;
    }
    .safe {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .malicious {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .loading {
      text-align: center;
      color: #666;
      display: none;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h3>بررسی امنیت لینک</h3>
    <div id="urlDisplay" class="url-box">در حال دریافت لینک صفحه...</div>
    <button id="checkBtn">آنالیز و بررسی لینک</button>
    
    <div id="loading" class="loading">درحال تحلیل با مدل‌های هوش مصنوعی...</div>
    <div id="resultBox" class="result"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
